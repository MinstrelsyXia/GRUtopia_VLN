gs: 500
cs: 0.1 # from maps.voxel_size
camera_height: 1.7
camera_fov: 90
robot_z: [0,1.7]
map_type: "IsaacSimMap" # "lseg", "gt", "clip", "clip_gradcam", "vlmaps_lseg_3d"
forward_dist: 0.1 # 0.05
turn_angle: 5 #1
sim_setting:
  default_agent: 0
  sensor_height: ${params.camera_height}
  color_sensor: True
  depth_sensor: False
  semantic_sensor: False
  lidar_sensor: False
  move_forward: ${params.forward_dist}
  turn_left: ${params.turn_angle}
  turn_right: ${params.turn_angle}
  width: 1024
  height: 1024
  enable_physics: False
  seed: 1
  lidar_fov: 360
  depth_img_for_lidar_n: 20
  img_save_dir: "/tmp"
sound_map_config:
  map_type: "wav2clip" # "clap" "audioclip" "wav2clip"
  detect_mode: "retrieval" # "classification" "retrieval"
controller_config:
  gs: ${params.gs}
  cs: ${params.cs}
  forward_dist: ${params.forward_dist}
  turn_angle: ${params.turn_angle}
  goal_dist_thres: 0.1
