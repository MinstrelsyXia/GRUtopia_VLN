NAME: 20250213_cma_pm_train_torchGPU1_bs2_lr2.5e-4_controller_distLight_clipEncoders
TRAINER_NAME: dagger_diffusion_policy # dagger / recollect_trainer
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
# SIMULATOR_GPU_IDS: [0]
# TORCH_GPU_ID: 1
# TORCH_GPU_IDS: [2]

NUM_ENVIRONMENTS: 4
# TENSORBOARD_DIR: data/tensorboard_dirs/*name
TENSORBOARD_DIR: data/checkpoints/*name
CHECKPOINT_FOLDER: data/checkpoints/*name/ckpts
EVAL_CKPT_PATH_DIR: data/checkpoints/*name/ckpts
# EVAL_CKPT_PATH_DIR: data/checkpoints/habitat_sotas/CMA_PM_DA_Aug_converted.pth
LOG_DIR: data/checkpoints/*name/logs
RESULTS_DIR: data/checkpoints/*name/evals

VIDEO_OPTION: -1 # -1 / true
VIDEO_DIR: data/checkpoints/*name/videos

SEED: 0
DDP:
  use: True
  use_dp: true # true for data parallel, false for DDP
  backend: nccl
  seed: 0
  fp16: False
  n_workers: 8
  find_unused_parameters: true
  local_rank: 0 

  node_rank: 0
  world_size: 4

EVAL:
  USE_CKPT_CONFIG: False
  SAVE_RESULTS: True
  # SPLIT: [val_seen, val_unseen]
  SPLIT: [val_seen]
  EPISODE_COUNT: -1
  MAX_STEPS: 195
  train_eval_interval: 100
  ACTION: descrete # descrete or xyyaw or speed
  SAMPLE: false

  # eval dataset settings
  re_eval: False # if true, will re-evaluate the episodes in the result_json_path
  load_eval_subset: False # if true, will load the eval subset (collect successfully)

  # for xyyaw
  success_distance: 3.0
  stop_x_threshold: 1e-2
  stop_y_threshold: 1e-2
  stop_yaw_threshold: 1e-1

  rotation_threshold: 1e-2

  # for dynamic len_traj_act
  use_dynamic_len_traj_act: false
  min_len_traj_act: 3
  max_len_traj_act: 8
  min_displacement: 0.15

  distance_threshold: 1.5
  num_sample: 1
  auto_remove: false

  start_eval_epoch: -1
  
  # stop settings
  stop_mode: progress # progress / distance
  distance_threshold: 1.5
  pm_threshold: 0.90

  # for isaac-sim envs
  sim_cfg_file: vln/configs/sim_cfg_policy_eval.yaml
  vln_cfg_file: vln/configs/vln_cfg_policy_eval.yaml
  step_interval: 50 
  
  # len_traj_act
  len_traj_act: 4

IL:
  epochs: 120
  batch_size: 2
  lr: 2.5e-4

  use_iw: True
  inflection_weight_coef: 3.2
  
  save_interval_epochs: 5
  save_interval_steps: 1500
  save_filter_frozen_weights: true # only save the learnable weights!
  load_from_ckpt: False
  ckpt_to_load: none
  load_from_pretrain: True

  dataset_root_dir: data/datasets/R2R_VLNCE_v1-3_corrected

  camera_name: 'pano_camera_0'
  Filter_failure: 
    use: true # drop the failure cases
    min_rgb_nums: 15 # the item that is fewer than this number would be dropped.

  analysis_time: False # analysis the processing time for each module

  lr_schedule:
    use: true
    type: "cosine" # 可选 cosine/step/linear
    warmup_epochs: 5
    warmup_factor: 0.1
    decay_factor: 0.1
    decay_epochs: [30, 45] # 用于step scheduler
    min_lr: 1e-5

  DAGGER:
    iterations: 5
    full_size: 10819
    lmdb_map_size: 1e12
    update_size: 5000
    p: 0.9
    preload_lmdb_features: true # !IMPORTANT!
    # lmdb_features_dir: data/sample_episodes/20241213_sample_episodes_descrete_controller/sample_data.lmdb
    # lmdb_features_dir: data/sample_episodes/20241216_sample_episodes_descrete_flash/sample_data.lmdb
    # lmdb_features_dir: data/sample_episodes/20250121_descrete_dagger_02/sample_data.lmdb
    # lmdb_features_dir: data/sample_episodes/20250208_descrete_dagger_03/sample_data.lmdb
    lmdb_features_dir: data/sample_episodes/20250211_sample_origin/sample_data.lmdb
    lmdb_features_dagger_update_dir: data/sample_episodes/*name/sample_data.lmdb
    pre_extract_img_features: true
    denoise_action: false # For debug!!!
    lmdb_save_episode_id: true
    save_img_raw: false
    sample_action_mode: policy # gt / policy / negative_sampling

    recollect_first: false

MODEL:
  policy_name: CMA_CLIP_Policy

  ablate_instruction: False
  ablate_depth: False
  ablate_rgb: false

  normalize_rgb: False
  
  TEXT_ENCODER:
    load_model: true
    max_length: 248
    update_text_encoder: false
    
    # model settings
    type: clip-long # roberta
    model_name: clip-long # meter
    model_path: data/pretrained/clip-long/longclip-B.pt # data/pretrained/meter/meter_clip16_224_roberta_pretrain.ckpt
    num_l_layers: 6
    hidden_size: 512
    vocab_size: 50265
    embedding_size: 512

    sot_token: 49406
    eot_token: 49407
    pad_token: 0

    # text Q-former
    use_qformer: False
    q_former_length: 5

  IMAGE_ENCODER:
    img_stack_nums: 4 # the history images for inputs
    use_stack: false
    dropout: 0.1
    use_env_drop: true
    env_drop: 0.3

    RGB:
      load_model: true
      update_rgb_encoder: False

      # model settings
      model_name: clip-long # clip-vit-base-patch32
      model_path: data/pretrained/clip-long/longclip-B.pt # data/pretrained/clip-vit-base-patch32
      rgb_proj: True # 768 -> 512?
      feature_dim: 768
      projection_dim: 512

      # img_mod
      img_mod: multi_patches_avg_pooling # cls / multi_patches_avg_pooling
      multi_patches_num: 5
  
    DEPTH:
      load_model: True
      update_depth_encoder: False

      # model settings
      bottleneck: resnet # TAC
      model_name: openai/clip-vit-base-patch32
      model_path: data/pretrained/TAC/tac_depth_encoder.pth
      feature_dim: 768
      projection_dim: 512

      # for Resnet
      cnn_type: VlnResnetDepthEncoder
      output_size: 128
      ddppo_checkpoint: data/ddppo-models/gibson-4plus-mp3d-train-val-test-resnet50.pth
      backbone: resnet50
  
  CROSS_MODAL_ENCODER:
    load_model: False
    input_type: 3
    num_x_layers: 2
    hidden_size: 512
    num_attention_heads: 8

    txt_to_img: False  # the same as in CMA
    txt_to_img_layer: 2
  
  STATE_ENCODER:
    hidden_size: 512
    rnn_type: "GRU"
  
  PROGRESS_MONITOR:
    use: True
    alpha: 1.0
  
  LORA:
    add_for_instruction_encoder: False
    add_for_rgb_encoder: False
    add_for_depth_encoder: False

    lora_r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    lora_start_layer: 6 # from this layer to add lora layers
    lora_query: True
    lora_key: False
    lora_value: False
    lora_projection: False
    lora_mlp: False
    lora_head: False


