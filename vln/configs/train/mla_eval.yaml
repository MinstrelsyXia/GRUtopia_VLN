NAME: 20250123_MLANet_eval
TRAINER_NAME: dagger_diffusion_policy # dagger / recollect_trainer
SIMULATOR_GPU_IDS: [0]
TORCH_GPU_ID: 0
TORCH_GPU_IDS: [0]
# SIMULATOR_GPU_IDS: [0]
# TORCH_GPU_ID: 1
# TORCH_GPU_IDS: [2]

NUM_ENVIRONMENTS: 4
# TENSORBOARD_DIR: data/tensorboard_dirs/*name
TENSORBOARD_DIR: data/checkpoints/*name
CHECKPOINT_FOLDER: data/checkpoints/*name/ckpts
EVAL_CKPT_PATH_DIR: data/checkpoints/*name/ckpts
EVAL_CKPT_PATH_DIR: data/checkpoints/mla/converted/mla_best_ppo_converted.pth
LOG_DIR: data/checkpoints/*name/logs
RESULTS_DIR: data/checkpoints/*name/evals

VIDEO_OPTION: true # -1 / true
VIDEO_DIR: data/checkpoints/*name/videos

VLN_DATASETS: data/datasets/R2R_VLNCE_v1-3_preprocessed

SEED: 0
DDP:
  use: false
  use_dp: true # true for data parallel, false for DDP
  backend: nccl
  seed: 0
  fp16: False
  n_workers: 8
  find_unused_parameters: true
  local_rank: 0 

  node_rank: 0
  world_size: 4

EVAL:
  USE_CKPT_CONFIG: False
  SAVE_RESULTS: True
  # SPLIT: [val_seen, val_unseen]
  SPLIT: [val_seen]
  EPISODE_COUNT: -1
  MAX_STEPS: 195
  train_eval_interval: 100
  ACTION: descrete # descrete or xyyaw or speed
  SAMPLE: false

  # eval dataset settings
  re_eval: False # if true, will re-evaluate the episodes in the result_json_path
  load_eval_subset: False # if true, will load the eval subset (collect successfully)

  # for xyyaw
  success_distance: 3.0
  stop_x_threshold: 1e-2
  stop_y_threshold: 1e-2
  stop_yaw_threshold: 1e-1

  rotation_threshold: 1e-2

  # for dynamic len_traj_act
  use_dynamic_len_traj_act: false
  min_len_traj_act: 3
  max_len_traj_act: 8
  min_displacement: 0.15

  distance_threshold: 1.5
  num_sample: 1
  auto_remove: false

  start_eval_epoch: -1
  
  # stop settings
  stop_mode: progress # progress / distance
  distance_threshold: 1.5
  pm_threshold: 0.90

  # for isaac-sim envs
  sim_cfg_file: vln/configs/sim_cfg_policy_eval.yaml
  vln_cfg_file: vln/configs/vln_cfg_policy_eval.yaml
  step_interval: 50 
  compute_shortest_path: False # if true, will compute the shortest path based on isaac-sim planner, otherwise, will use the geodesic distance in the data
  
  # len_traj_act
  len_traj_act: 4

IL:
  epochs: 60
  batch_size: 2
  lr: 1e-4

  use_iw: True
  inflection_weight_coef: 3.2
  
  save_interval_epochs: 2
  save_interval_steps: 1500
  save_filter_frozen_weights: true # only save the learnable weights!
  load_from_ckpt: true
  ckpt_to_load: data/checkpoints/mla/converted/mla_best_ppo_converted.pth
  load_from_pretrain: false

  camera_name: 'pano_camera_0'
  Filter_failure: 
    use: true # drop the failure cases
    min_rgb_nums: 15 # the item that is fewer than this number would be dropped.

  analysis_time: False # analysis the processing time for each module

  lr_schedule:
    use: true
    type: "cosine" # 可选 cosine/step/linear
    warmup_epochs: 5
    warmup_factor: 0.1
    decay_factor: 0.1
    decay_epochs: [30, 45] # 用于step scheduler
    min_lr: 1e-5

  DAGGER:
    iterations: 5
    full_size: 10819
    update_size: 5000
    p: 0.9
    preload_lmdb_features: true # !IMPORTANT!
    lmdb_features_dir: data/sample_episodes/20241120_sample_episodes_full/sample_data.lmdb
    lmdb_features_dagger_update_dir: data/sample_episodes/*name/sample_data.lmdb
    pre_extract_img_features: true
    denoise_action: false # For debug!!!
    lmdb_save_episode_id: true
    save_img_raw: false
    sample_action_mode: policy # gt / policy / negative_sampling

    recollect_first: false

MODEL:
  policy_name: MLAPolicy

  ablate_instruction: False
  ablate_depth: False
  ablate_rgb: false

  normalize_rgb: False
  
  INSTRUCTION_ENCODER:
    sensor_uuid: "instruction"
    vocab_size: 2504
    use_pretrained_embeddings: true
    embedding_file: "data/datasets/R2R_VLNCE_FSASub/embeddings200d.json.gz"
    dataset_vocab: "data/datasets/R2R_VLNCE_FSASub/train/train.json.gz"
    fine_tune_embeddings: False
    embedding_size: 200
    hidden_size: 128
    rnn_type: "LSTM"
    final_state_only: False
    bidirectional: True

  RGB_ENCODER:
    cnn_type: "TorchVisionResNet50"
    output_size: 256
    trainable: False
  
  DEPTH_ENCODER:
    cnn_type: "VlnResnetDepthEncoder"
    output_size: 3072
    feature_size: 256
    single_size: 192
    backbone: "resnet50"
    ddppo_checkpoint: "data/ddppo-models/gibson-2plus-resnet50.pth"
    trainable: False
  
  STATE_ENCODER:
    hidden_size: 512
    rnn_type: "GRU"
    rnn_type_low: "GRU"
    num_layers_low: 1
    rnn_type_high: "GRU"
    num_layers_high: 1
    rnn_type_action: "GRU"
    num_layers_action: 1
  
  PROGRESS_MONITOR:
    use: False
    alpha: 1.0
  
  SEQ2SEQ:
    use_prev_action: False
    encoder_prev_action: True
    decoder_prev_action: True
  
  PEAK_ATTENTION:
    use: False
    type: 1 # can be 0,1,2,3, the order of ascending
    alpha: 0.4 # means lambda in paper
    sigma: 0.6
    steps: 97371
    threshold: 0.6
  
  MLA:
    feature_drop: 0.25 # means FD in paper
    heads: 8
    feature_drop: 0.0
    hidden_size: 512

  CLIP:
    rgb_level: -2
    model_name: data/pretrained/CLIP-B-32/ViT-B-32.pt
    output_size: 512
    feature_size: 256
    vit_size: 768
    trainable: false
    downsample_size: 3
    rgb_level: -1
  
  PEAK_ATTENTION:
    use: False
    curve: "gaussian"
    alpha: 0.4
    sigma: 0.6
    type: 1
    steps: 97371
    threshold: 0.6

  ablate_sub_instruction: false
  ablate_instruction: false
  ablate_rgb: False
  ablate_depth: False

  ablate_mla: False
  ablate_fsa: False


